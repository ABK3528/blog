rg/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel" transform="translate(138, 452.234375)"><g class="label" data-id="L_COND_SKIP_0" transform="translate(-75.53125, -12)"><foreignObject width="151.0625" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"><p>R &lt; 15：低代价任务</p></span></div></foreignObject></g></g><g class="edgeLabel" transform="translate(448, 452.234375)"><g class="label" data-id="L_COND_DO_0" transform="translate(-75.53125, -12)"><foreignObject width="151.0625" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"><p>R ≥ 15：高代价任务</p></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_DO_MULTI_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel" transform="translate(293, 1100.234375)"><g class="label" data-id="L_MULTI_DIMINISH_0" transform="translate(-66.1796875, -12)"><foreignObject width="132.359375" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"><p>同一模型连看 3 遍</p></span></div></foreignObject></g></g><g class="edgeLabel" transform="translate(603, 1100.234375)"><g class="label" data-id="L_MULTI_DIVERSE_0" transform="translate(-55.7890625, -12)"><foreignObject width="111.578125" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"><p>换视角 / 换工具</p></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default" id="my-svg-flowchart-START-0" data-look="classic" transform="translate(293, 71)"><rect class="basic label-container" style="" x="-130" y="-63" width="260" height="126"/><g class="label" style="" transform="translate(-100, -48)"><rect/><foreignObject width="200" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>工程任务类型与返工代价倍数 R<br />（修复逃逸 Bug 成本 ÷ 单次生成成本）</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-COND-1" data-look="classic" transform="translate(293, 299.6171875)"><polygon points="115.6171875,0 231.234375,-115.6171875 115.6171875,-231.234375 0,-115.6171875" class="label-container" transform="translate(-115.1171875, 115.6171875)"/><g class="label" style="" transform="translate(-88.6171875, -12)"><rect/><foreignObject width="177.234375" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>返工代价 R 是否 &gt; 15？</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-SKIP-3" data-look="classic" transform="translate(138, 612.234375)"><rect class="basic label-container" style="fill:#fef2f2 !important;stroke:#ef4444 !important;stroke-width:1px !important" x="-130" y="-99" width="260" height="198"/><g class="label" style="" transform="translate(-100, -84)"><rect/><foreignObject width="200" height="168"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>❌ 不建议加繁琐 Review<br />如：一次性探针、两步小脚本<br />不审期望 1.2 vs 审一次 2.1<br />结论：直接跑，挂了随时再敲一句更划算</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-DO-5" data-look="classic" transform="translate(448, 612.234375)"><rect class="basic label-container" style="fill:#dcfce7 !important;stroke:#16a34a !important;stroke-width:2px !important" x="-130" y="-123" width="260" height="246"/><g class="label" style="" transform="translate(-100, -108)"><rect/><foreignObject width="200" height="216"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>✅ 坚决必须做 Review<br />如：核心业务特性、发布流水线、数据库变更<br />R=50 时：不审期望 5.8 vs 审一次 3.5 (省 40% 成本)<br />R=100 时：不审期望 10.6 vs 审一次 5.0 (省 53% 成本)</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-MULTI-7" data-look="classic" transform="translate(448, 924.234375)"><polygon points="139,0 278,-139 139,-278 0,-139" class="label-container" transform="translate(-138.5, 139)"/><g class="label" style="" transform="translate(-100, -24)"><rect/><foreignObject width="200" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>要不要同一个模型再审第二遍、第三遍？</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-DIMINISH-9" data-look="classic" transform="translate(293, 1236.234375)"><rect class="basic label-container" style="fill:#fee2e2 !important;stroke:#dc2626 !important" x="-130" y="-87" width="260" height="174"/><g class="label" style="" transform="translate(-100, -72)"><rect/><foreignObject width="200" height="144"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>❌ 边际收益指数衰减<br />第 2 次增量 = ω · d (盲区重叠度 ω ≈ 0.5)<br />第 3 次增量 = ω² · d<br />成本线性翻倍，收益迅速见底</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-DIVERSE-11" data-look="classic" transform="translate(603, 1236.234375)"><rect class="basic label-container" style="fill:#dbeafe !important;stroke:#2563eb !important;stroke-width:2px !important" x="-130" y="-99" width="260" height="198"/><g class="label" style="" transform="translate(-100, -84)"><rect/><foreignObject width="200" height="168"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>✅ 正确解法：多维度异构校验<br />1. 确定性测试 (跑用例)<br />2. 换独立 Prompt (专项看异常/并发)<br />3. 换不同架构模型或人工终审</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs></svg>