ble-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_L3_L4_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_GEN_L1_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_L4_PROD_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default" id="my-svg-flowchart-GEN-0" data-look="classic" transform="translate(173, 47)"><rect class="basic label-container" style="" x="-130" y="-39" width="260" height="78"/><g class="label" style="" transform="translate(-100, -24)"><rect/><foreignObject width="200" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>🤖 AI 编写业务代码（基于大模型单步 99% 生成能力）</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-L1-1" data-look="classic" transform="translate(173, 272)"><rect class="basic label-container" style="fill:#dcfce7 !important;stroke:#16a34a !important;stroke-width:2px !important" x="-130" y="-111" width="260" height="222"/><g class="label" style="" transform="translate(-100, -96)"><rect/><foreignObject width="200" height="192"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>【第 1 道防线：压死误伤率 a】 编译器 / Linter / 静态类型系统<br />TypeScript / mypy / Ruff · 误伤率 a ≈ 0<br />⚡ 秒级拦截语法、拼写与类型不匹配，不耗费 LLM 算力</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-L2-2" data-look="classic" transform="translate(173, 556)"><rect class="basic label-container" style="fill:#dbeafe !important;stroke:#2563eb !important;stroke-width:2px !important" x="-130" y="-123" width="260" height="246"/><g class="label" style="" transform="translate(-100, -108)"><rect/><foreignObject width="200" height="216"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>【第 2 道防线：阻断前提错 ρ】 独立上下文契约测试与断言<br />切断生成会话历史 · 由独立 QA 流程根据 PRD 背靠背编写单测<br />🛡️ 消灭模型自洽偏置，杜绝'测试断言全绿、业务逻辑全错'的伪单测</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-L3-3" data-look="classic" transform="translate(173, 852)"><rect class="basic label-container" style="fill:#ede9fe !important;stroke:#7c3aed !important;stroke-width:2px !important" x="-130" y="-123" width="260" height="246"/><g class="label" style="" transform="translate(-100, -108)"><rect/><foreignObject width="200" height="216"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>【第 3 道防线：定向抓局部 d】 独立 Agent / PR 专项审查<br />单次 Review 只聚焦单一维度（并发竞态、异常分支、安全边界）<br />🎯 打破多重审查盲区重叠度 ω，以清晰目标抓取深层缺陷</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-L4-4" data-look="classic" transform="translate(173, 1136)"><rect class="basic label-container" style="fill:#fef9c3 !important;stroke:#ca8a04 !important;stroke-width:2px !important" x="-130" y="-111" width="260" height="222"/><g class="label" style="" transform="translate(-100, -96)"><rect/><foreignObject width="200" height="192"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>【第 4 道防线：守住高返工 R】 核心系统发布门禁<br />返工倍数 R &gt; 15 的关键路径（金融账本、数据库 DDL、主网关发布）<br />🔒 强制确定性 CI 全绿 + 人工工程师二次签署，对冲灾难性回滚</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-PROD-12" data-look="classic" transform="translate(173, 1373)"><rect class="basic label-container" style="fill:#bbf7d0 !important;stroke:#15803d !important;stroke-width:2px !important" x="-130" y="-51" width="260" height="102"/><g class="label" style="" transform="translate(-100, -36)"><rect/><foreignObject width="200" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>🚀 生产发布 / 安全合入主干（整体可靠性从 90.4% 跃升至 99%+）</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs></svg>